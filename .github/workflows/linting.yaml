name: Linting

on: pull_request

jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # This tells the action to look for the .nvmrc file in the root
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run lint:prettier:check"
