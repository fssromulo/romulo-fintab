name: Automated Tests

on: pull_request

jobs:
  jest:
    name: Jest Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # This tells the action to look for the .nvmrc file in the root
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm test
